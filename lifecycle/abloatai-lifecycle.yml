status_page:
  url: null
  found: false
  note: >-
    NO status page. status.abloatai.com does not resolve to a page (HTTP 404) and
    www.abloatai.com/status is a Next.js SPA soft-200 returning the generic marketing shell, not a
    status surface. There is no Statuspage/Instatus/BetterStack property linked from the docs, the
    site footer or the GitHub org. The closest thing Ablo ships is self-diagnosis rather than
    provider transparency — `ablo doctor`, `ablo branch check` and GET /v1/logs/delivery
    (getLogDelivery) tell you whether YOUR writes reached anyone, which is a genuinely useful
    signal but reports the customer's plane, not Ablo's platform health.
  probes:
    - {url: 'https://status.abloatai.com/', http_status: 404}
    - {url: 'https://www.abloatai.com/status', http_status: 200, real_page: false, note: 'SPA catch-all — identical title and shell as every other unrouted path'}
  self_diagnosis_alternatives:
    - {surface: 'GET /v1/branches/{id}/status', operationId: getBranchStatus, scope: one branch}
    - {surface: 'GET /v1/logs/delivery', operationId: getLogDelivery, scope: 'how much of what was recorded could reach anyone'}
    - {surface: 'ablo doctor', scope: 'whether the last hour of changes was deliverable'}
