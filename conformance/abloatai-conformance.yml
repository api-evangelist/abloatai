    conforms: false
    evidence: 'No /.well-known/ document served on any host.'
  - id: a2a
    conforms: false
    evidence: 'No agent card at /.well-known/agent-card.json or /.well-known/agent.json on any host.'
  - id: asyncapi
    conforms: false
    evidence: 'No AsyncAPI document published despite two event surfaces (signed webhooks and a WSS realtime stream). /asyncapi.yaml and /asyncapi.json 404 on both docs and API hosts.'
    note: 'Partly structural — the event type set is a function of the customer''s pushed schema, so a document would have to be generated per project.'
