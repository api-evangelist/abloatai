certifications: []
certifications_note: >-
  NONE published. No SOC 2, ISO 27001, PCI DSS, HIPAA, FedRAMP or GDPR posture is stated anywhere on
  the site, docs or GitHub org. trust.abloatai.com does not resolve (404) and www.abloatai.com/security
  is an SPA soft-200 with the generic marketing shell rather than a security page. The only
  compliance-adjacent commitments are Enterprise contract terms on the pricing page (customer-managed
  encryption keys, private networking, single sign-on, audit log export) — capabilities, not attestations.
  No Compliance pointer is emitted, because there is no published compliance program to point at.
