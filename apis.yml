apis:
- name: Ablo Integration-Helper MCP Server
  description: 'A public, anonymous, stateless Streamable-HTTP MCP server Ablo runs on its own domain
    so an AI coding assistant writing an Ablo integration can search the real docs, inspect the actual
    SDK export surface, lint a defineSchema source and scaffold a starter — instead of guessing at the
    API. Five tools, 44 doc resources addressable at ablo://docs/{name}, and three parameterised prompts.
    It serves documentation only: there is no data plane and nothing org-scoped, which is why it needs
    no auth. The separate coordination MCP server is the data plane.'
