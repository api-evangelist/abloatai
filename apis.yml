aid: abloatai
name: Ablo
description: 'Ablo is collaboration infrastructure for AI agents: one API that lets agents, apps and people
  claim, change and confirm the same database rows without clobbering each other. Rows stay in the customer''s
  own Postgres — Ablo holds only an ordered transaction log and the coordination state — while durable
  claims (leases with a wait-line, which make a second writer wait and then hand it the fresh row rather
  than lock), guarded idempotent writes with stale premises, atomic batch commits and signed webhook delivery
  turn concurrent multi-agent editing into something that serializes instead of racing. The surface is
  a 32-operation OpenAPI 3.1 REST API, a WSS realtime stream, a TypeScript SDK and CLI released in lockstep
  with the API, and two MCP servers.'
