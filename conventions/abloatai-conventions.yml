  product_version: 0.55.0 (info.version in the OpenAPI; matches the npm release train)
  detail: lifecycle/ablo-lifecycle.yml
error_envelope:
  format: custom AbloError JSON object (NOT RFC 9457 / application/problem+json)
  fields: [type, code, message, doc_url, request_id, event_id, param, errors]
  self_documenting: 'Every error carries a doc_url deep-linking to its anchor in the published registry.'
  detail: errors/ablo-error-codes.yml
rate_limit_signalling:
