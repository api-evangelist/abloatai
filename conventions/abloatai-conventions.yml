  headers_documented: [X-Usage-Limit, X-Usage-Used, X-Usage-Remaining, X-Usage-Reset, Retry-After]
  headers_observed_on_mcp: [x-ratelimit-limit, x-ratelimit-remaining, x-ratelimit-reset]
