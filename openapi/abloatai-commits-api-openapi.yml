                                    - notify
                                required:
                                - target
                                - watermark
                                - lifetime
                                - onStale
                                additionalProperties: false
                          operations:
                            readOnly: true
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  anyOf:
                                  - type: string
