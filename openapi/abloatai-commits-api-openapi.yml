                                                id:
                                                  type: string
                                                field:
                                                  type: string
                                                fields:
                                                  readOnly: true
                                                  type: array
                                                  items:
                                                    type: string
                                                meta:
                                                  type: object
                                                  additionalProperties: true
                                              required:
                                              - model
                                              - id
                                              additionalProperties: false
                                          truncated:
                                            type: boolean
                                        required:
