                                transactionId:
                                  anyOf:
                                  - type: string
                                  - type: 'null'
                                claimId:
                                  anyOf:
                                  - type: string
                                    minLength: 1
                                  - type: 'null'
                                readAt:
                                  anyOf:
                                  - type: integer
                                    minimum: 0
                                    maximum: 9007199254740991
                                  - type: 'null'
                                onStale:
                                  anyOf:
                                  - type: string
                                    enum:
                                    - reject
                                    - overwrite
                                    - notify
                                  - type: 'null'
                                fenceToken:
                                  anyOf:
                                  - type: number
                                  - type: 'null'
                                action:
                                  type: string
                                model:
                                  type: string
                                data:
                                  type: object
                                  properties:
                                    retention:
                                      type: string
                                      const: redacted
                                  required:
