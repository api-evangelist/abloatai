                                        additionalProperties: true
                                    required:
                                    - object
                                    - target
                                    - readAt
                                    - observedSyncId
                                    - writtenBy
                                    - scope
                                    - currentValues
                                    additionalProperties: false
                                  - type: object
                                    properties:
                                      object:
