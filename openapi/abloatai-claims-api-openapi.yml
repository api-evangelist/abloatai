      operationId: heartbeatModelClaim
  /v1/models/{model}/{id}/claim/reorder:
    post:
      tags:
      - claims
      summary: Reorder the wait-line (privileged)
      description: Name the waiters you want at the front, in the order you want them. Waiters you leave out keep their relative places behind them.
      parameters:
      - name: model
        in: path
        required: true
        schema:
          type: string
        description: A model name from your pushed schema, e.g. `item`.
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                order:
                  readOnly: true
                  type: array
                  items:
                    type: object
                    properties:
                      heldBy:
                        type: string
                      claimId:
                        type: string
                    required:
                    - heldBy
                    - claimId
      responses:
        '200':
          description: Reordered
          content:
            application/json:
              schema:
