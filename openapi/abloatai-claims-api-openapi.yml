        '503':
          description: A required service is temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        default:
          description: An HTTP error not otherwise listed; decoded through the canonical envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      operationId: listClaims
    post:
      tags:
      - claims
      summary: Claim a row named in the body
      description: The same operation as `POST /v1/models/{model}/{id}/claim`, with the row in `target` instead of the URL. Answers identically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                claimId:
                  type: string
                target:
                  anyOf:
                  - type: object
                    properties:
                      model:
                        type: string
                      id:
                        anyOf:
                        - type: string
                        - type: 'null'
                      field:
                        type: string
                      fields:
                        readOnly: true
                        type: array
                        items:
                          type: string
                      meta:
                        type: object
                        additionalProperties: true
                  - type: 'null'
                reason:
                  type: string
                description:
                  type: string
                meta:
                  type: object
                  additionalProperties: true
                ttl:
                  anyOf:
                  - anyOf:
                    - type: number
                      exclusiveMinimum: 0
                    - type: string
                      pattern: ^(\d+(?:\.\d+)?)(ms|s|m|h)$
                  - type: 'null'
                queue:
                  type: boolean
      responses:
        '201':
          description: The lease is yours.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimAcquire'
        '202':
          description: Already held, and you asked to queue. You are in line at `position`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimAcquire'
        '400':
          description: The request did not satisfy the published contract.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: The Bearer credential is missing, malformed, or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
