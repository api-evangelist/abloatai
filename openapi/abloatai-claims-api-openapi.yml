      properties:
        id:
          type: string
        position:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        expiresAt:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        fenceToken:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        object:
          type: string
          const: claim
        status:
          type: string
          enum:
          - active
          - queued
          - committed
          - expired
          - canceled
