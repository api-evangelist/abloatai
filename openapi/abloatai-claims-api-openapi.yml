                      exclusiveMinimum: 0
                    - type: string
                      pattern: ^(\d+(?:\.\d+)?)(ms|s|m|h)$
                  - type: 'null'
                details:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Lease extended (or queued slot refreshed)
