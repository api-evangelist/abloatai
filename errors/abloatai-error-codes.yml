note: 'Ablo publishes a canonical, generated error registry — every code below is a documented, stable machine identifier
  whose anchor is the target of the doc_url the API itself returns in the error body. Retryability is the provider''s
  own published flag. This is a registry, not RFC 9457: the envelope is a custom AbloError JSON object, not application/problem+json.'
