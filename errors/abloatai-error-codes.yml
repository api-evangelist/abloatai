envelope:
  schema: openapi/abloatai-api-openapi.yml#/components/schemas/ErrorEnvelope
  media_type: application/json
  fields:
  - field: type
    required: true
    meaning: Coarse error class — catch with instanceof or switch on it (AbloValidationError, AbloAuthenticationError,
      AbloClaimedError, AbloRateLimitError, AbloStaleContextError).
  - field: code
    required: false
    meaning: Stable machine identifier; the key of this catalog.
  - field: message
    required: true
    meaning: Human-readable explanation.
  - field: doc_url
    required: false
    meaning: Deep link to this code's anchor in the published registry.
  - field: request_id
    required: false
    meaning: Correlates to Ablo server logs; also on the X-Request-Id response header.
  - field: event_id
    required: false
    meaning: Event correlation id.
  - field: param
    required: false
    meaning: The offending parameter, when the error is field-scoped.
  - field: errors
    required: false
    meaning: Array of per-field {code,message,param} for multi-field validation failures.
  observed_example:
    type: AbloAuthenticationError
    code: auth_no_credentials
    message: no recognized authentication credential was presented
    probed: https://api.abloatai.com/api/v1/schema
    http_status: 401
    note: Also echoed on the X-Auth-Failure response header, which is CORS-exposed.
retryability: Published per code. Transient transport and lease failures are retryable; validation and permission
  errors are not. Retryable means the SAME request can succeed later without changing anything.
categories:
- name: Authentication
  description: Missing, invalid, revoked, or expired credentials. Re-authenticate.
- name: Permission
  description: Credentials were valid but the action is forbidden for this caller.
- name: Capability
  description: The connection's resolved scope does not cover the attempted action.
- name: Claim contention
  description: The target is held by another participant, or a claim lease could not be acquired. Usually retryable
    once the holder releases.
- name: Conflict
  description: The write collided with concurrent state (stale read, idempotency mismatch, incompatible change).
- name: Validation
  description: The request payload or parameters were invalid. Fix the input and retry.
- name: Not found
  description: The referenced resource does not exist (or is hidden by scope).
- name: Tenant / schema resolution
  description: The named model could not be resolved in the tenant schema.
- name: Schema
  description: Schema declaration or migration problems.
- name: Bootstrap
  description: Initial snapshot fetch problems.
- name: Transport
  description: Network, connection, queue, and timeout failures. Generally retryable.
- name: Rate limit
  description: Too many requests. Back off before retrying.
- name: Server
  description: Server-side failures. Generally retryable with backoff.
- name: Client (SDK) invariants
  description: Local SDK usage errors — never sent over the network. No HTTP status.
