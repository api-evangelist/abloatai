note: >-
  Ablo publishes TWO MCP servers and they are different products. (1) The COORDINATION server
  (@abloatai/mcp) is the data plane — it renders the model-scoped API as tools and requires an
  sk_/rk_ API key; it is distributed as an npm package run over stdio, but as of this probe the
  package name @abloatai/mcp returns 404 from the npm registry, so the documented install command
  cannot currently be executed. (2) The INTEGRATION-HELPER server is a stateless Streamable-HTTP
  server the docs describe as customer-mounted at <your-app>/api/mcp — but Ablo also runs its own
  public instance on its own marketing domain at https://www.abloatai.com/api/mcp, anonymous and
  reachable right now. That instance is what was probed here.
deployment:
  mode: both
  endpoint: https://www.abloatai.com/api/mcp
  install: npx -y @abloatai/mcp
  package: https://www.npmjs.com/package/@abloatai/mcp
  auth: none
  verified: probed
servers:
