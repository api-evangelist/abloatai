note: >-
  Two MCP servers with disjoint jobs. The COORDINATION server is the one that maps onto REST: its
  row tools are, by Ablo's own documentation, the model-scoped API (/api/v1/models/...) rendered as
  tools, so each binds to a real operationId with high confidence. Its live tools/list could not be
  introspected because the @abloatai/mcp package is not published to npm (HTTP 404), so those rows
  are mapped by the documented tool table rather than by an observed inputSchema. The
  INTEGRATION-HELPER server WAS introspected live (5 tools with real inputSchemas) and binds to
  nothing in REST — it is a documentation/scaffolding surface with no data plane, which is the
  single largest surface divergence in this provider.
